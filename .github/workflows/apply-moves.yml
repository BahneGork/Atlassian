# Placements saved from the site's edit mode ("Gem for alle") arrive as moves/*.json.
# Apply them to tools/curation.py, rebuild data/erukana.json and publish.
name: Apply map moves

on:
  push:
    branches: [main]
    paths: ["moves/*.json"]

permissions:
  contents: write
  pages: write

concurrency: apply-moves

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply moves and rebuild
        run: |
          shopt -s nullglob
          files=(moves/*.json)
          if [ ${#files[@]} -eq 0 ]; then exit 0; fi
          for f in "${files[@]}"; do python3 tools/apply_moves.py "$f"; done
          git rm -q "${files[@]}"
          python3 tools/build.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply map moves saved from the site"
          git push

      # Pushes made with the workflow token may not start a Pages build on their own.
      - name: Request Pages build
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
